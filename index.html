<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="마크한글(MarkHangeul) Rust/WASM visual pronunciation notation playground"
    />
    <title>MarkHangeul</title>
    <base data-trunk-public-url />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [["\\(", "\\)"], ["$", "$"]],
          displayMath: [["\\[", "\\]"], ["$$", "$$"]],
          processEscapes: true
        },
        options: {
          skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
        },
        startup: {
          typeset: false
        }
      };
      window.markHangeulTypesetMath = function () {
        const run = function () {
          if (window.MathJax && window.MathJax.typesetPromise) {
            window.MathJax.typesetPromise();
          } else {
            window.setTimeout(run, 80);
          }
        };
        run();
      };
    </script>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"
    ></script>
    <link data-trunk rel="rust" href="crates/markhangeul-web/Cargo.toml" />
    <link data-trunk rel="css" href="assets/styles/markhangeul.css" />
    <link data-trunk rel="css" href="assets/styles/playground.css" />
  </head>
  <body>
    <main id="app"></main>
  </body>
</html>
