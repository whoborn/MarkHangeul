<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-labelledby="title desc"><title id="title">한 음절의 네 가지 음높이</title><desc id="desc">마 글자 아래에 평평함, 상승, 내렸다 상승, 하강 곡선을 표시합니다. 점이 각 음높이 곡선을 따라 움직입니다.</desc><style>text{font-family:system-ui,sans-serif;fill:#174d3e}.label{font-size:14px;fill:#698374}.guide{fill:none;stroke:#649679;stroke-width:2}.dot{fill:#ce8157}.dot circle{animation-duration:3.6s;animation-iteration-count:infinite;animation-timing-function:linear}.flat{animation-name:flat}.rise{animation-name:rise}.dip{animation-name:dip}.fall{animation-name:fall}@keyframes flat{0%{transform:translate(0,0)}100%{transform:translate(74px,0)}}@keyframes rise{0%{transform:translate(0,0)}100%{transform:translate(74px,-25px)}}@keyframes dip{0%{transform:translate(0,0)}34%{transform:translate(25px,17px)}100%{transform:translate(74px,-13px)}}@keyframes fall{0%{transform:translate(0,0)}100%{transform:translate(74px,30px)}}@media(prefers-reduced-motion:reduce){.dot circle{animation:none}}</style><path d="M45 190H575" stroke="#d4dfce" stroke-dasharray="3 7"/><g font-size="76" text-anchor="middle"><text x="95" y="157">마</text><text transform="translate(242 168) skewY(-10)">마</text><text x="385" y="176">마</text><text transform="translate(532 159) skewY(10)">마</text></g><g class="guide"><path d="M58 205H132"/><path d="M205 230L279 205"/><path d="M348 223L373 240L422 210"/><path d="M495 205L569 235"/></g><g class="dot"><circle class="flat" cx="58" cy="205" r="4"/><circle class="rise" cx="205" cy="230" r="4"/><circle class="dip" cx="348" cy="223" r="4"/><circle class="fall" cx="495" cy="205" r="4"/></g><g class="label" text-anchor="middle"><text x="95" y="282">높게 · 55</text><text x="242" y="282">올라가며 · 35</text><text x="385" y="282">꺾이며 · 214</text><text x="532" y="282">내려가며 · 51</text></g></svg>
