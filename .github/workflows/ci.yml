name: Validate MarkHangeul
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo check -p markhangeul-web --target wasm32-unknown-unknown --locked
      - run: cargo install --locked trunk --version 0.21.14
      - run: cargo install --locked wasm-bindgen-cli --version 0.2.121
      - run: ./scripts/build-site.sh /MarkHangeul/
