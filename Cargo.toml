[workspace]
members = [
  "crates/markhangeul-core",
  "crates/markhangeul-web"
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
authors = ["Whoborn Inc. Bae Young Sik"]
repository = "https://github.com/Whoborn/MarkHangeul"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-segmentation = "1.12"
pulldown-cmark = "0.13"
wasm-bindgen = "0.2"
yew = { version = "0.21", features = ["csr"] }
web-sys = "0.3"
